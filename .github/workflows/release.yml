name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build exe
        run: |
          V=${GITHUB_REF_NAME#v}
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags desktop,production -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=$V" -o MiniMonitor.exe .
          mkdir -p dist && zip -j dist/MiniMonitor-$V-windows-x64.zip MiniMonitor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Go core -> AAR (gomobile)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 21 \
            -ldflags "-s -w" -o android/app/libs/minimon.aar ./mobile
      - name: Frontend -> assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r frontend/* android/app/src/main/assets/www/
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V=${GITHUB_REF_NAME#v}
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          export VERSION_NAME="$V" VERSION_CODE="${{ github.run_number }}"
          cd android && gradle --no-daemon assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/MiniMonitor-$V.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
