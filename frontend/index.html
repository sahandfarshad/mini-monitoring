<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMonitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root">
  <div id="shell" dir="ltr">
    <header id="bar" style="--wails-draggable:drag">
      <span class="brand"><i></i><b>mini</b>monitor</span>
      <nav style="--wails-draggable:no-drag">
        <button id="bAdd" data-tt="addServer">
          <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
        <button id="bSize" class="txt" data-tt="sizeTip"><span data-t="size">Size</span> <em id="bSizeV">M</em></button>
        <button id="bSet" data-tt="settings">
          <svg viewBox="0 0 16 16"><path d="M3 5h6M12 5h1M3 11h1M7 11h6"/><circle cx="10.5" cy="5" r="1.5"/><circle cx="5.5" cy="11" r="1.5"/></svg></button>
        <button id="bPin" title="Always on top">
          <svg class="pin-on" viewBox="0 0 16 16"><path class="fill" d="M6 2.5h4l-.5 4 2 2v1h-7v-1l2-2z"/><path d="M8 9.5V14"/></svg>
          <svg class="pin-off" viewBox="0 0 16 16"><path d="M6 2.5h4l-.5 4 2 2v1h-7v-1l2-2zM8 9.5V14M2.5 2.5l11 11"/></svg></button>
        <button id="bMin" data-tt="minimize">
          <svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button>
        <button id="bClose" data-tt="close">
          <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
      </nav>
    </header>
    <main id="list"></main>
    <div id="empty" hidden>
      <button id="bAdd2"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span data-t="addServer">Add server</span></button>
    </div>
  </div>

  <!-- add / edit server -->
  <section id="dlg" class="sheet" hidden>
    <h3 id="dlgTitle"></h3>
    <label><span data-t="name"></span><input id="fName" data-tp="optional"></label>
    <div class="row">
      <label class="grow"><span data-t="host"></span><input id="fHost" dir="ltr" placeholder="1.2.3.4"></label>
      <label class="port"><span data-t="port"></span><input id="fPort" dir="ltr" type="number" value="22"></label>
    </div>
    <label><span data-t="user"></span><input id="fUser" dir="ltr" value="root"></label>
    <div class="seg" id="fAuth">
      <button data-v="password" class="on" data-t="password"></button>
      <button data-v="key" data-t="key"></button>
    </div>
    <label id="lPass"><span data-t="password"></span><input id="fPass" dir="ltr" type="password"></label>
    <div id="lKey" hidden>
      <label><span data-t="privKey"></span><textarea id="fKey" dir="ltr" rows="3" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></label>
      <div class="row">
        <button class="ghost desk" id="fKeyFile" data-t="chooseFile"></button>
        <label class="grow"><span data-t="passphrase"></span><input id="fKeyPass" dir="ltr" type="password" data-tp="ifAny"></label>
      </div>
    </div>
    <label><span data-t="iface"></span><input id="fIface" dir="ltr" data-tp="auto"></label>
    <p id="dlgMsg"></p>
    <div class="actions">
      <button class="ghost" id="dTest" data-t="test"></button>
      <span class="sp"></span>
      <button class="ghost" id="dCancel" data-t="cancel"></button>
      <button class="primary" id="dSave" data-t="save"></button>
    </div>
  </section>

  <!-- settings -->
  <section id="set" class="sheet" hidden>
    <h3 data-t="settings"></h3>
    <div class="grid">
      <span data-t="language"></span>
      <button id="sLang" class="langbtn" type="button"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.8 1.9 2.6 3.9 2.6 6S9.8 12.1 8 14C6.2 12.1 5.4 10.1 5.4 8S6.2 3.9 8 2z"/></svg><b id="sLangCur"></b><i>▾</i></button>
      <div id="langPop" class="langpop" hidden><div class="langlist" role="listbox"></div></div>
      <span data-t="defSize"></span>
      <div class="seg" id="sSize"><button data-v="s">S</button><button data-v="m">M</button><button data-v="l">L</button></div>
      <span><t data-t="scale"></t> S</span><input type="range" id="sScaleS" min="0.6" max="2" step="0.05">
      <span><t data-t="scale"></t> M</span><input type="range" id="sScaleM" min="0.6" max="2" step="0.05">
      <span><t data-t="scale"></t> L</span><input type="range" id="sScaleL" min="0.6" max="2" step="0.05">
      <span data-t="opacity"></span><input type="range" id="sOpacity" min="0.3" max="1" step="0.02">
      <span data-t="span"></span><input type="number" id="sHistory" min="10" max="600" dir="ltr">
      <span data-t="interval"></span><input type="number" id="sInterval" min="1" max="60" dir="ltr">
      <span data-t="unit"></span>
      <div class="seg" id="sBits"><button data-v="1">Mbps</button><button data-v="0">MB/s</button></div>
      <span class="desk" data-t="onTop"></span><input class="desk" type="checkbox" id="sOnTop">
      <span data-t="showTitle"></span><input type="checkbox" id="sShowTitle">
      <span data-t="colors"></span>
      <div class="colors">
        <input type="color" id="sRx" data-tt="download"><input type="color" id="sTx" data-tt="upload">
        <input type="color" id="sCpu" title="CPU"><input type="color" id="sRam" title="RAM">
        <input type="color" id="sBg" data-tt="background">
      </div>
    </div>
    <div class="actions">
      <small id="ver"></small><span class="sp"></span>
      <button class="primary" id="sDone" data-t="done"></button>
    </div>
  </section>

  <div id="menu" hidden></div>
</div>
<script src="i18n.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
